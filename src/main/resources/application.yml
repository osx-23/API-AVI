spring:
  application:
    name: API-AVI
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}

avi:
  supabase:
    url: ${SUPABASE_URL:https://adozechgzkbqopujaapp.supabase.co}
    key: ${SUPABASE_PUBLISHABLE_KEY:}
  whisper:
    command: ${WHISPER_COMMAND:whisper}
    model: ${WHISPER_MODEL:small}
    language: ${WHISPER_LANGUAGE:Spanish}
    device: ${WHISPER_DEVICE:}
    timeout-seconds: ${WHISPER_TIMEOUT_SECONDS:600}
